<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <!-- Background Gradient matching the app's dark theme (#020617 / #0f172a) -->
    <linearGradient id="finwiseBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    
    <!-- Emerald Border Gradient -->
    <linearGradient id="finwiseBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#059669" stop-opacity="0.25" />
    </linearGradient>

    <!-- Vibrant Emerald Trendline Gradient -->
    <linearGradient id="finwiseTrend" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="60%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>

    <!-- Subtle Emerald Glow -->
    <filter id="emeraldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Squircle Container (same proportions as rounded-xl in side panel) -->
  <rect x="8" y="8" width="112" height="112" rx="28" fill="url(#finwiseBg)" stroke="url(#finwiseBorder)" stroke-width="4" />
  <rect x="12" y="12" width="104" height="104" rx="24" fill="#10b981" fill-opacity="0.08" />

  <!-- Upward Financial Trendline with Arrow (FinWise Signature Icon) -->
  <polyline points="28,88 56,60 76,74 100,42" fill="none" stroke="url(#finwiseTrend)" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" filter="url(#emeraldGlow)" />
  <polyline points="80,42 100,42 100,62" fill="none" stroke="url(#finwiseTrend)" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" filter="url(#emeraldGlow)" />
  
  <!-- Subtle Glowing Milestone Node -->
  <circle cx="100" cy="42" r="3.5" fill="#ffffff" />
</svg>
