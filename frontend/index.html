<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FinoGyaan — Institutional Autonomous Wealth Advisor</title>
  <link rel="icon" type="image/png" href="/finogyaan-icon.png">
  <link rel="apple-touch-icon" href="/finogyaan-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'system-ui', '-apple-system', 'sans-serif'],
            mono: ['"JetBrains Mono"', 'monospace'],
          },
          colors: {
            gray: {
              850: '#1f2937',
              900: '#0f172a',
              950: '#020617',
            }
          }
        }
      }
    };
    // Initialize theme immediately to prevent flashing
    if (localStorage.getItem('finwise_theme') === 'light') {
      document.documentElement.classList.remove('dark');
    } else {
      document.documentElement.classList.add('dark');
    }
  </script>
  <style>
    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      font-feature-settings: "cv02", "cv03", "cv04", "cv11";
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      transition: background-color 0.2s ease, color 0.2s ease;
    }
    html.dark body {
      background-color: #020617;
      color: #f1f5f9;
    }
    html:not(.dark) body {
      background-color: #f8fafc;
      color: #0f172a;
    }
    .font-mono, .tabular-nums {
      font-feature-settings: "tnum" on, "zero" on;
    }
    ::selection {
      background: rgba(16, 185, 129, 0.25);
      color: #059669;
    }
    html.dark ::selection {
      color: #6ee7b7;
    }
    /* Custom scrollbar */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    html.dark ::-webkit-scrollbar-track {
      background: #0b0f19; 
    }
    html.dark ::-webkit-scrollbar-thumb {
      background: #1e293b; 
      border-radius: 9999px;
    }
    html:not(.dark) ::-webkit-scrollbar-track {
      background: #f1f5f9; 
    }
    html:not(.dark) ::-webkit-scrollbar-thumb {
      background: #cbd5e1; 
      border-radius: 9999px;
    }
    /* Natural easing curve & transitions */
    :root {
      --ease-out-expo: cubic-bezier(0.16, 1, 0.3, 1);
    }
    .ease-out-expo {
      transition-timing-function: var(--ease-out-expo);
    }
    
    @media (prefers-reduced-motion: reduce) {
      *, ::before, ::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
        scroll-behavior: auto !important;
      }
    }
  </style>
</head>
<body class="bg-slate-50 dark:bg-slate-950 text-slate-900 dark:text-slate-100 antialiased selection:bg-emerald-500/20 selection:text-emerald-600 dark:selection:text-emerald-300">
  <div id="root"></div>
  <script type="module" src="./index.tsx"></script>
</body>
</html>
